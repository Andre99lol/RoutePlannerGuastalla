<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pianificatore Percorsi & Condivisione WhatsApp</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-bold shadow-md shadow-emerald-600/20">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">RoutePlanner</h1>
                    <p class="text-xs text-slate-500">Seleziona le tappe in ordine e condividi</p>
                </div>
            </div>
            <button id="btn-reset" class="text-xs text-slate-500 hover:text-red-600 font-medium px-3 py-1.5 rounded-lg border border-slate-200 hover:border-red-200 transition-all flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-rotate-right"></i> Reset
            </button>
        </div>
    </header>

    <main class="max-w-3xl w-full mx-auto px-4 py-6 flex-grow space-y-6">
        
        <!-- Info Card -->
        <div class="bg-blue-50 border border-blue-100 rounded-2xl p-4 flex items-start space-x-3 text-blue-900 shadow-sm">
            <i class="fa-solid fa-circle-info mt-0.5 text-blue-500 text-lg flex-shrink-0"></i>
            <div class="text-sm">
                <span class="font-semibold block mb-0.5">Come funziona?</span>
                Clicca sui pulsanti sottostanti nell'ordine in cui desideri visitarli. Il numero mostrerà la sequenza esatta del tuo itinerario multi-stop.
            </div>
        </div>

        <!-- Places Selection Grid -->
        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Punti di Interesse Disponibili</h2>
                <span id="selection-count" class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">0 tappe selezionate</span>
            </div>

            <!-- Grid rendered via external index.js -->
            <div id="places-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Injected dynamically -->
            </div>
        </div>

        <!-- Selected Summary Panel -->
        <div id="summary-panel" class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm hidden space-y-4">
            <h3 class="font-semibold text-slate-900 text-sm flex items-center gap-2">
                <i class="fa-solid fa-list-ol text-emerald-600"></i> Ordine del Percorso Creato
            </h3>
            <ol id="ordered-list" class="space-y-2 text-sm">
                <!-- Injected dynamically -->
            </ol>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 sticky bottom-0 z-10 shadow-lg">
        <div class="max-w-3xl mx-auto px-4 py-4 flex flex-col sm:flex-row gap-3">
            <button id="btn-maps" disabled
                class="flex-1 bg-slate-200 text-slate-400 font-semibold py-3.5 px-6 rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed shadow-none">
                <i class="fa-solid fa-diamond-turn-right text-lg"></i> Apri su Google Maps
            </button>
            <button id="btn-whatsapp" disabled
                class="flex-1 bg-slate-200 text-slate-400 font-semibold py-3.5 px-6 rounded-xl transition-all flex items-center justify-center gap-2 cursor-not-allowed shadow-none">
                <i class="fa-brands fa-whatsapp text-xl"></i> Condividi su WhatsApp
            </button>
        </div>
    </footer>

    <!-- External JavaScript logic file -->
    <script src="index.js"></script>
</body>
</html>
